<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AquaTrack - Тест подключения</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body{font-family:sans-serif; padding:20px;}</style>
</head>
<body>

<h2>AquaTrack — тест подключения</h2>
<div id="status">⏳ Проверка подключения...</div>
<button id="btn-test" style="margin-top:10px;">Повторить тест</button>

<script>
const URL = 'https://okqqomgkrvvfabqpvbrm.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rcXFvbWdrcnZ2ZmFicXB2YnJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMDYwMzYsImV4cCI6MjEwNDU4MjAzNn0.iyuWqW7Mdc5LGymrhaItuwc4gHlPqb5wKuwkD4rU3Sc';

const sb = window.supabase.createClient(URL, KEY);
const statusEl = document.getElementById('status');
const btn = document.getElementById('btn-test');

async function test() {
    statusEl.innerText = '🔍 Запрос к базе...';
    try {
        const { data, error } = await sb.from('employees').select('count').limit(1);
        if (error) {
            statusEl.innerHTML = `<span style="color:red;">❌ Ошибка: ${error.message}</span>`;
            console.error('Supabase error:', error);
        } else {
            statusEl.innerHTML = `<span style="color:green;">✅ Успешно! Всего сотрудников: ${data[0]?.count || 0}</span>`;
            console.log('Data:', data);
        }
    } catch (e) {
        statusEl.innerHTML = `<span style="color:red;">💥 Исключение: ${e.message}</span>`;
        console.error('Exception:', e);
    }
}

btn.addEventListener('click', test);
test(); // запуск при загрузке
</script>
</body>
</html>
