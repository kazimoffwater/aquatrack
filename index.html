<script>
(function() {
    const URL = 'https://okqqomgkrvvfabqpvbrm.supabase.co';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rcXFvbWdrcnZ2ZmFicXB2YnJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMDYwMzYsImV4cCI6MjEwNDU4MjAzNn0.iyuWqW7Mdc5LGymrhaItuwc4gHlPqb5wKuwkD4rU3Sc';
    
    const sb = window.supabase.createClient(URL, KEY);
    let user = null;
    let allEmps = [];
    let allLogs = [];
    let updateInterval = null;

    const loginBox = document.getElementById('login-box');
    const adminBox = document.getElementById('admin-box');
    const empBox = document.getElementById('emp-box');
    const btnLogin = document.getElementById('btn-login');
    const errorMsg = document.getElementById('error-msg');
    const statusEl = document.getElementById('status');

    function getBakuTime() { return new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Baku' }); }
    function getBakuDate() { return new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Asia/Baku' }); }
    function getTodayKey() { return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Baku' }); }
    
    // 🔧 НОВОЕ: Получение корректного UTC диапазона для даты по Баку (UTC+4)
    function getBakuDateRange(dateStr) {
        // dateStr в формате "YYYY-MM-DD"
        const start = new Date(dateStr + 'T00:00:00+04:00').toISOString();
        const end = new Date(new Date(dateStr + 'T00:00:00+04:00').getTime() + 24 * 60 * 60 * 1000).toISOString();
        return { start, end };
    }

    function formatDuration(ms) {
        if (ms < 0) ms = 0;
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
    }
    
    setInterval(() => {
        const clock = document.getElementById('emp-clock');
        const date = document.getElementById('emp-date');
        if (clock) clock.innerText = getBakuTime();
        if (date) date.innerText = getBakuDate().charAt(0).toUpperCase() + getBakuDate().slice(1);
    }, 1000);

    sb.from('employees').select('count', { count: 'exact', head: true }).then(({ error }) => {
        if (error) {
            statusEl.style.background = '#fee2e2';
            statusEl.style.color = '#dc2626';
            statusEl.innerHTML = '❌ Ошибка подключения';
        } else {
            statusEl.style.background = '#dcfce7';
            statusEl.style.color = '#16a34a';
            statusEl.innerHTML = '✅ Система готова к работе';
            setTimeout(() => { statusEl.style.display = 'none'; }, 2500);
        }
    });

    btnLogin.addEventListener('click', async function() {
        const login = document.getElementById('inp-login').value.trim().toLowerCase();
        const pass = document.getElementById('inp-pass').value.trim();
        
        if (!login) {
            errorMsg.innerText = 'Введите логин!';
            errorMsg.style.display = 'block';
            return;
        }
        
        btnLogin.innerText = '⏳ Вход...';
        btnLogin.disabled = true;
        errorMsg.style.display = 'none';
        
        const {data, error} = await sb.from('employees').select('*').eq('login', login).single();
        
        if (error || !data) {
            errorMsg.innerText = 'Пользователь не найден!';
            errorMsg.style.display = 'block';
            btnLogin.innerText = '🔐 Войти в систему';
            btnLogin.disabled = false;
            return;
        }
        
        if (data.role === 'admin' && data.password !== pass) {
            errorMsg.innerText = 'Неверный пароль!';
            errorMsg.style.display = 'block';
            btnLogin.innerText = '🔐 Войти в систему';
            btnLogin.disabled = false;
            return;
        }
        
        user = data;
        localStorage.setItem('at_user', JSON.stringify(user));
        await loadEmps();
        showMain();
    });

    document.getElementById('btn-logout-admin').addEventListener('click', () => { 
        if (updateInterval) clearInterval(updateInterval);
        localStorage.removeItem('at_user'); 
        location.reload(); 
    });
    document.getElementById('btn-logout-emp').addEventListener('click', () => { 
        localStorage.removeItem('at_user'); 
        location.reload(); 
    });

    // 🔧 ИСПРАВЛЕНО: Загружаем логи только за текущие сутки, без жесткого limit, и сортируем по возрастанию для корректного подсчета
    async function loadEmps() {
        const {data: emps} = await sb.from('employees').select('*');
        if (emps) allEmps = emps;
        
        const { start, end } = getBakuDateRange(getTodayKey());
        const {data: logs} = await sb.from('activity_logs')
            .select('*')
            .gte('created_at', start)
            .lt('created_at', end)
            .order('created_at', {ascending: true}); // ВАЖНО: для подсчета времени нужен хронологический порядок
            
        if (logs) allLogs = logs;
    }

    function showMain() {
        loginBox.style.display = 'none';
        if (user.role === 'admin') {
            adminBox.style.display = 'block';
            empBox.style.display = 'none';
            document.getElementById('admin-name').innerText = user.name;
            updateStats();
            renderEmpList();
            fillSelects();
            document.getElementById('cal-date').value = getTodayKey();
            
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(async () => {
                await loadEmps();
                if (document.getElementById('tab-monitoring').style.display !== 'none') {
                    updateStats();
                    renderEmpList();
                }
            }, 10000); // Увеличил до 10 сек для снижения нагрузки на БД
        } else {
            adminBox.style.display = 'none';
            empBox.style.display = 'block';
            document.getElementById('emp-name').innerText = user.name;
            renderEmpUI();
            loadEmpHistory();
        }
    }

    function updateStats() {
        const emps = allEmps.filter(u => u.role !== 'admin');
        document.getElementById('stat-total').innerText = emps.length;
        document.getElementById('stat-active').innerText = emps.filter(u => u.status === 'working').length;
        document.getElementById('stat-break').innerText = emps.filter(u => u.status === 'break').length;
        document.getElementById('stat-offline').innerText = emps.filter(u => u.status === 'offline').length;
    }

    // 🔧 ИСПРАВЛЕНО: Надежный конечный автомат (state machine) для подсчета времени
    function calculateWorkTime(empId) {
        const empLogs = allLogs.filter(l => l.employee_id === empId);
        let workMs = 0;
        let breakMs = 0;
        let state = 'offline'; // offline, working, break
        let lastTransitionTime = null;
        const now = new Date();
        
        empLogs.forEach(l => {
            const d = new Date(l.created_at);
            const action = l.action.toLowerCase();
            
            if (action.includes('начало') || action.includes('вернулся')) {
                if (state === 'break' && lastTransitionTime) {
                    breakMs += (d - lastTransitionTime);
                }
                state = 'working';
                lastTransitionTime = d;
            } 
            else if (action.includes('пауза') || action.includes('перерыв')) {
                if (state === 'working' && lastTransitionTime) {
                    workMs += (d - lastTransitionTime);
                }
                state = 'break';
                lastTransitionTime = d;
            } 
            else if (action.includes('завершил')) {
                if (state === 'working' && lastTransitionTime) {
                    workMs += (d - lastTransitionTime);
                } else if (state === 'break' && lastTransitionTime) {
                    breakMs += (d - lastTransitionTime);
                }
                state = 'offline';
                lastTransitionTime = null;
            }
        });
        
        // Если смена все еще активна, добавляем время до текущего момента
        if (state === 'working' && lastTransitionTime) {
            workMs += (now - lastTransitionTime);
        } else if (state === 'break' && lastTransitionTime) {
            breakMs += (now - lastTransitionTime);
        }
        
        return { workMs, breakMs };
    }

    function renderEmpList() {
        const list = document.getElementById('emp-list');
        const emps = allEmps.filter(u => u.role !== 'admin');
        list.innerHTML = '';
        
        emps.forEach(u => {
            const { workMs, breakMs } = calculateWorkTime(u.id);
            const workTime = formatDuration(workMs);
            const breakTime = formatDuration(breakMs);
            
            let sc = '#94a3b8', bg = '#f8fafc', txt = '⚫ Оффлайн', icon = '🏠';
            if (u.status === 'working') { 
                sc = '#10b981'; bg = '#ecfdf5'; txt = '🟢 На работе'; icon = '💼';
            } else if (u.status === 'break') { 
                sc = '#f59e0b'; bg = '#fffbeb'; txt = '☕ На перерыве'; icon = '☕';
            }
            
            const div = document.createElement('div');
            div.style.cssText = `padding:20px; border-radius:14px; border:2px solid ${sc}20; background:${bg}; display:grid; grid-template-columns: 1fr auto; gap:15px; align-items:center;`;
            div.innerHTML = `
                <div style="display:flex; align-items:center; gap:15px;">
                    <div style="width:55px; height:55px; background:white; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:${sc}; box-shadow:0 2px 8px rgba(0,0,0,0.05);">${u.name.charAt(0).toUpperCase()}</div>
                    <div>
                        <div style="font-weight:700; color:#1e293b; font-size:16px;">${u.name}</div>
                        <div style="color:#64748b; font-size:13px; margin-bottom:4px;">@${u.login}</div>
                        <div style="display:flex; gap:15px; font-size:13px;">
                            <span style="color:#10b981; font-weight:600;">💼 ${workTime}</span>
                            <span style="color:#f59e0b; font-weight:600;">☕ ${breakTime}</span>
                        </div>
                    </div>
                </div>
                <div style="padding:10px 18px; background:white; border-radius:10px; font-weight:700; color:${sc}; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,0.05); white-space:nowrap;">${txt}</div>
            `;
            list.appendChild(div);
        });
    }

    function fillSelects() {
        const emps = allEmps.filter(u => u.role !== 'admin');
        const opts = '<option value="">Выберите...</option>' + emps.map(u => '<option value="'+u.id+'">'+u.name+'</option>').join('');
        const calOpts = '<option value="all">📊 Все сотрудники</option>' + emps.map(u => '<option value="'+u.id+'">'+u.name+'</option>').join('');
        
        document.getElementById('fine-emp').innerHTML = opts;
        document.getElementById('pass-emp').innerHTML = opts;
        document.getElementById('cal-emp').innerHTML = calOpts;
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const tab = this.dataset.tab;
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.getElementById('tab-' + tab).style.display = 'block';
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.style.background = 'white'; b.style.color = '#64748b'; b.style.border = '2px solid #e2e8f0';
            });
            this.style.background = '#2563eb'; this.style.color = 'white'; this.style.border = 'none';
            if (tab === 'monitoring') { updateStats(); renderEmpList(); }
        });
    });

    // 🔧 ИСПРАВЛЕНО: Корректный запрос по диапазону дат вместо .eq
    document.getElementById('btn-cal-show').addEventListener('click', async function() {
        const empId = document.getElementById('cal-emp').value;
        const date = document.getElementById('cal-date').value;
        const results = document.getElementById('cal-results');
        if (!date) return alert('Выберите дату!');
        
        results.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">⏳ Загрузка...</div>';
        
        const { start, end } = getBakuDateRange(date);
        
        let query = sb.from('activity_logs')
            .select('*')
            .gte('created_at', start)
            .lt('created_at', end)
            .order('created_at', {ascending: false});
            
        if (empId !== 'all') {
            query = query.eq('employee_id', empId);
        }
        
        const {data, error} = await query;
        
        if (error) {
            results.innerHTML = '<div style="text-align:center; padding:30px; color:#ef4444;">❌ Ошибка загрузки: ' + error.message + '</div>';
            return;
        }
        
        if (!data || data.length === 0) {
            results.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">📭 Нет записей за эту дату</div>';
            return;
        }
        
        // Создаем карту имен на случай, если связь (Foreign Key) в Supabase не настроена
        const empMap = {};
        allEmps.forEach(e => empMap[e.id] = e.name);
        
        let html = '<div style="display:grid; gap:10px;">';
        data.forEach(l => {
            const t = new Date(l.created_at).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', timeZone:'Asia/Baku'});
            // Пробуем взять имя из связи, если нет - берем из нашей карты
            const name = (l.employees && l.employees.name) ? l.employees.name : (empMap[l.employee_id] || 'Неизвестно');
            
            html += `<div style="background:#f8fafc; padding:15px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; border-left:4px solid #2563eb;">
                <div>
                    <div style="font-weight:700; color:#1e293b;">${name}</div>
                    <div style="color:#64748b; font-size:14px; margin-top:4px;">${l.action}${l.details ? ' — '+l.details : ''}</div>
                </div>
                <div style="color:#64748b; font-family:monospace; font-size:14px;">${t}</div>
            </div>`;
        });
        results.innerHTML = html + '</div>';
    });

    document.getElementById('btn-fine').addEventListener('click', async function() {
        const empId = document.getElementById('fine-emp').value;
        const amt = document.getElementById('fine-amt').value;
        const reason = document.getElementById('fine-reason').value;
        if (!empId || !amt || !reason) return alert('Заполните все поля!');
        const emp = allEmps.find(e => e.id === empId);
        await sb.from('activity_logs').insert([{ 
            employee_id: empId, 
            action: 'ШТРАФ', 
            details: emp.name + ': ' + amt + ' AZN (' + reason + ')' 
        }]);
        alert('✅ Штраф выписан!');
        document.getElementById('fine-amt').value = '';
        document.getElementById('fine-reason').value = '';
    });

    document.getElementById('btn-add').addEventListener('click', async function() {
        const name = document.getElementById('new-name').value.trim();
        const login = document.getElementById('new-login').value.trim().toLowerCase();
        const pass = document.getElementById('new-pass').value.trim();
        if (!name || !login || !pass) return alert('Заполните все поля!');
        const {error} = await sb.from('employees').insert([{ name, login, password: pass, role: 'emp', status: 'offline' }]);
        if (error) alert('❌ Ошибка: ' + error.message);
        else {
            alert('✅ Сотрудник добавлен!');
            document.getElementById('new-name').value = '';
            document.getElementById('new-login').value = '';
            document.getElementById('new-pass').value = '';
            await loadEmps();
            fillSelects();
            updateStats();
        }
    });

    document.getElementById('btn-pass').addEventListener('click', async function() {
        const empId = document.getElementById('pass-emp').value;
        const np = document.getElementById('new-password').value;
        if (!empId || !np) return alert('Выберите сотрудника и введите пароль!');
        await sb.from('employees').update({password: np}).eq('id', empId);
        alert('✅ Пароль изменён!');
        document.getElementById('new-password').value = '';
    });

    function renderEmpUI() {
        const badge = document.getElementById('emp-badge');
        const card = document.getElementById('emp-status-card');
        const actions = document.getElementById('emp-actions');
        const logsDiv = document.getElementById('emp-logs');
        
        card.style.background = 'linear-gradient(135deg,#2563eb,#3b82f6)';
        
        if (user.status === 'offline') {
            badge.innerText = '🏠 Не на работе';
            actions.innerHTML = '<button id="btn-start" style="width:100%; padding:20px; background:linear-gradient(135deg,#10b981,#34d399); color:white; border:none; border-radius:14px; font-size:18px; font-weight:800; cursor:pointer; box-shadow:0 4px 15px rgba(16,185,129,0.3);">▶ НАЧАТЬ ДЕНЬ</button>';
            document.getElementById('btn-start').onclick = async () => {
                await sb.from('employees').update({status:'working'}).eq('id', user.id);
                await sb.from('activity_logs').insert([{employee_id:user.id, action:'Начало смены'}]);
                user.status = 'working'; renderEmpUI();
            };
        } else if (user.status === 'working') {
            badge.innerText = '💼 На работе';
            badge.style.background = '#10b981';
            actions.innerHTML = '<div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;"><button id="btn-pause" style="padding:20px; background:linear-gradient(135deg,#f59e0b,#fbbf24); color:white; border:none; border-radius:14px; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 4px 15px rgba(245,158,11,0.3);">⏸ ПАУЗА</button><button id="btn-stop" style="padding:20px; background:linear-gradient(135deg,#ef4444,#f87171); color:white; border:none; border-radius:14px; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 4px 15px rgba(239,68,68,0.3);">⏹ ОСТАНОВИТЬ</button></div>';
            document.getElementById('btn-pause').onclick = async () => {
                await sb.from('employees').update({status:'break'}).eq('id', user.id);
                await sb.from('activity_logs').insert([{employee_id:user.id, action:'Пауза'}]);
                user.status = 'break'; renderEmpUI();
            };
            document.getElementById('btn-stop').onclick = async () => {
                await sb.from('employees').update({status:'offline'}).eq('id', user.id);
                await sb.from('activity_logs').insert([{employee_id:user.id, action:'Завершил смену'}]);
                user.status = 'offline'; renderEmpUI();
            };
        } else if (user.status === 'break') {
            badge.innerText = '☕ На паузе';
            badge.style.background = '#f59e0b';
            card.style.background = 'linear-gradient(135deg,#d97706,#f59e0b)';
            actions.innerHTML = '<div style="text-align:center; margin-bottom:15px; font-weight:700; color:#92400e; font-size:15px;">Причина возвращения:</div><div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"><button class="ret-btn" data-r="Обед" style="padding:14px; background:white; border:2px solid #fcd34d; border-radius:10px; color:#92400e; font-weight:700; cursor:pointer;">🍽 Обед</button><button class="ret-btn" data-r="Перекур" style="padding:14px; background:white; border:2px solid #fcd34d; border-radius:10px; color:#92400e; font-weight:700; cursor:pointer;">🚬 Перекур</button><button class="ret-btn" data-r="Личные" style="padding:14px; background:white; border:2px solid #fcd34d; border-radius:10px; color:#92400e; font-weight:700; cursor:pointer;">👤 Личные</button><button class="ret-btn" data-r="Тех." style="padding:14px; background:white; border:2px solid #fcd34d; border-radius:10px; color:#92400e; font-weight:700; cursor:pointer;">🔧 Тех.</button></div>';
            document.querySelectorAll('.ret-btn').forEach(btn => {
                btn.onclick = async () => {
                    const r = btn.dataset.r;
                    await sb.from('employees').update({status:'working'}).eq('id', user.id);
                    await sb.from('activity_logs').insert([{employee_id:user.id, action:'Вернулся ('+r+')', details:r}]);
                    user.status = 'working'; renderEmpUI();
                };
            });
        }

        // Загрузка логов сотрудника
        const { start, end } = getBakuDateRange(getTodayKey());
        const { data: logs } = await sb.from('activity_logs')
            .select('*')
            .eq('employee_id', user.id)
            .gte('created_at', start)
            .lt('created_at', end)
            .order('created_at', {ascending: false});
            
        const todayLogs = logs || [];
        logsDiv.innerHTML = todayLogs.length ? '' : '<div style="text-align:center; color:#94a3b8; padding:20px;">Нет записей за сегодня</div>';
        todayLogs.forEach(l => {
            const t = new Date(l.created_at).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', timeZone:'Asia/Baku'});
            logsDiv.innerHTML += `<div style="background:#f8fafc; padding:14px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border-left:4px solid #2563eb;"><span style="font-weight:600; color:#1e293b;">${l.action}${l.details ? ' ('+l.details+')' : ''}</span><span style="color:#64748b; font-family:monospace; font-size:14px;">${t}</span></div>`;
        });
    }

    function loadEmpHistory() {
        const historyDiv = document.getElementById('emp-history');
        historyDiv.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px;">⏳ Загрузка...</div>';
        sb.from('activity_logs').select('*').eq('employee_id', user.id).order('created_at', {ascending:false}).limit(100).then(({data}) => {
            if (!data || data.length === 0) {
                historyDiv.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">📭 История пуста</div>';
                return;
            }
            let html = '<div style="display:grid; gap:8px;">';
            data.forEach(l => {
                const d = new Date(l.created_at).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric', timeZone:'Asia/Baku'});
                const t = new Date(l.created_at).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', timeZone:'Asia/Baku'});
                html += `<div style="background:#f8fafc; padding:12px 15px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; font-size:14px;"><span style="color:#1e293b; font-weight:500;">${l.action}${l.details ? ' ('+l.details+')' : ''}</span><span style="color:#64748b; font-family:monospace;">${d} ${t}</span></div>`;
            });
            historyDiv.innerHTML = html + '</div>';
        });
    }

    (async function() {
        const saved = JSON.parse(localStorage.getItem('at_user'));
        if (saved && saved.id) {
            const {data} = await sb.from('employees').select('*').eq('id', saved.id).single();
            if (data) {
                user = data;
                await loadEmps();
                showMain();
            }
        }
    })();
})();
</script>
